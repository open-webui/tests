[project]
name = "open-webui-tests"
version = "0.1.0"
description = "External test suite for Open WebUI - page accessibility, integration, and SSO testing"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

dependencies = [
    "pytest~=8.4.1",
    "pytest-asyncio>=0.23.0",
    "pytest-playwright>=0.5.0",
    "playwright==1.49.1",
    "pytest-html>=4.0.0",
    "allure-pytest>=2.13.0",
    "httpx==0.28.1",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

# Explicitly disable package discovery since this is a test suite, not a library
[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["e2e", "integration", "unit"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "auth_required: marks tests that require authentication",
    "admin_required: marks tests that require admin privileges",
    "public: marks tests for public pages (no auth needed)",
    "unit: marks unit tests that test backend logic directly",
]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
filterwarnings = [
    # Ignore deprecation warnings from Open WebUI and its dependencies
    "ignore::sqlalchemy.exc.MovedIn20Warning",
    "ignore::DeprecationWarning:alembic",
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
