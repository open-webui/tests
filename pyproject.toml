[project]
name = "open-webui-tests"
version = "0.1.0"
description = "External test suite for Open WebUI — unit (source-level), API integration, and end-to-end browser tests"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BSD-3-Clause" }

dependencies = [
    "pytest~=8.4.1",
    "pytest-asyncio>=0.23.0",
    "pytest-playwright>=0.5.0",
    "playwright==1.49.1",
    "pytest-html>=4.0.0",
    "pytest-split>=0.11.0",
    "allure-pytest>=2.13.0",
    "httpx==0.28.1",
    "python-dotenv>=1.0.0",
    # Imported at load time by the harness and the integration and browser
    # tests, so the suite collects against an instance without the Open WebUI
    # source installed. Unpinned, so a shared environment keeps Open WebUI's versions.
    "aiohttp",
    "av",
    "bcrypt",
    "brotli",
    "cryptography",
    "googleapis-common-protos",
    "grpcio",
    "ldap3",
    "mcp",
    "numpy",
    "openai",
    "opentelemetry-proto",
    "packaging",
    "pillow",
    "protobuf",
    "psutil",
    "psycopg[binary]",
    "pyasn1",
    "pycrdt",
    "pydantic",
    "PyJWT",
    "pymilvus",
    "pyotp",
    "pypdf",
    "python-engineio",
    "python-socketio",
    "redis",
    "soundfile",
    "sqlalchemy",
    "tokenizers",
    "uvicorn",
    "weaviate-client",
    "websockets",
]

# This is a test suite, not an importable library: tell setuptools there
# are no packages to build so `pip install -e .` installs deps + metadata
# without choking on the flat unit/ integration/ e2e/ layout.
[tool.setuptools]
py-modules = []

[project.optional-dependencies]
# Embedded PostgreSQL for the migration tests that run against a real
# postgres (unit/migrations/*). Tests skip cleanly when it's absent.
postgres = [
    "pgserver>=0.1.4",
]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pgserver>=0.1.4",
]

[tool.pytest.ini_options]
testpaths = ["unit", "integration", "e2e"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Tests opt in with an explicit @pytest.mark.asyncio (strict mode).
asyncio_mode = "strict"
# anyio's to_process worker pool is keyed per event loop and its idle-worker
# entries do not survive pytest-asyncio's session loop teardown between
# modules, so a second to_process.run_sync raises BrokenWorkerProcess. dev's
# recurrence helpers now evaluate RRULEs in such workers, so a fresh loop per
# test is required for every async test that reaches one.
# (The pooled aiosqlite rationale for "session" no longer applies since the
# async db tests moved to their own fixtures.)
asyncio_default_test_loop_scope = "function"
markers = [
    # ── purpose ────────────────────────────────────────────────────────────
    "regression: pinned to a specific upstream issue/PR; fails only if that bug returns",
    "journey: broad baseline coverage of a feature, not pinned to one issue",
    # ── cost ───────────────────────────────────────────────────────────────
    "slow: long-running (comprehensive scans, real postgres boot). Deselect with -m 'not slow'",
    # ── scope / auth (browser + API tests) ─────────────────────────────────
    "public: public pages, no authentication",
    "auth_required: requires an authenticated user session",
    "admin_required: requires an admin session",
    "api: API-level test via httpx, no browser",
    "real_socket_timing: page_for pages get a new chat's socket events unheld, for a bug in that race (e2e)",
    "secure_context: the test's browsers open the loopback address, a secure context, for a feature the browser offers only there (e2e)",
    # ── area (set at collection, by path) ──────────────────────────────────
    "terminal: a test of a terminal module: under a terminals/ directory, or with terminal or tether in its file name",
    # ── dependency contract tests (unit/deps/) ─────────────────────────────
    "depcheck: per-dependency API-surface / usage contract test (run after a bump)",
    # ── capability (positive selection; tests also auto-skip when unmet) ────
    "requires_source: needs the open-webui backend source checkout (OPEN_WEBUI_SOURCE_DIR)",
    "requires_instance: needs an Open WebUI you started yourself at OPEN_WEBUI_URL",
    "requires_browser: needs Playwright browsers (e2e)",
    "requires_postgres: needs the pgserver package (embedded PostgreSQL)",
]
addopts = [
    "--tb=short",
    "--strict-markers",
    "--strict-config",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
