# Runs the source-level regression suite against a given Open WebUI ref.
# Callable from open-webui/open-webui so a release can be gated on it.
name: Regression suite

on:
  workflow_call:
    inputs:
      open-webui-ref:
        description: Ref of open-webui/open-webui to test (tag, branch or SHA)
        required: true
        type: string
      tests-ref:
        description: Ref of open-webui/tests to run
        required: false
        type: string
        default: main
      suite:
        description: Test paths to run
        required: false
        type: string
        default: unit
  workflow_dispatch:
    inputs:
      open-webui-ref:
        description: Ref of open-webui/open-webui to test (tag, branch or SHA)
        required: true
        type: string
        default: dev
      tests-ref:
        description: Ref of open-webui/tests to run
        required: false
        type: string
        default: main
      suite:
        description: Test paths to run
        required: false
        type: string
        default: unit

# Queued rather than cancelled: a caller gating a release on this workflow would
# otherwise see its required check go red because another run took the slot.
concurrency:
  group: regression-${{ inputs.open-webui-ref }}-${{ inputs.tests-ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the test suite
        uses: actions/checkout@v5
        with:
          repository: open-webui/tests
          ref: ${{ inputs.tests-ref }}
          path: tests

      - name: Check out Open WebUI
        uses: actions/checkout@v5
        with:
          repository: open-webui/open-webui
          ref: ${{ inputs.open-webui-ref }}
          path: open-webui

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            open-webui/backend/requirements.txt
            tests/pyproject.toml

      # torch comes in transitively via sentence-transformers and defaults to the CUDA
      # build, which is several GB of nvidia-* wheels this suite never runs. Pinning the
      # CPU build first, as the Dockerfile does, keeps the install to a few minutes.
      - name: Install dependencies
        run: |
          uv pip install --system 'torch<=2.9.1' --index-url https://download.pytorch.org/whl/cpu
          uv pip install --system -r open-webui/backend/requirements.txt
          uv pip install --system -e "./tests[postgres]"

      # Importing open_webui.config creates DATA_DIR and clears STATIC_DIR, so each job
      # gets its own scratch rather than the shared temp dir the suite falls back to.
      - name: Run the suite
        working-directory: tests
        env:
          OPEN_WEBUI_SOURCE_DIR: ${{ github.workspace }}/open-webui/backend
          DATA_DIR: ${{ runner.temp }}/owui-data
          STATIC_DIR: ${{ runner.temp }}/owui-static
          WEBUI_SECRET_KEY: ci-regression-key
        run: |
          mkdir -p "$DATA_DIR" "$STATIC_DIR"
          pytest ${{ inputs.suite }} -q --html=report.html --self-contained-html

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report-${{ inputs.open-webui-ref }}
          path: tests/report.html
          if-no-files-found: ignore

  # The suite boots its own instances from the checkout.
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the test suite
        uses: actions/checkout@v5
        with:
          repository: open-webui/tests
          ref: ${{ inputs.tests-ref }}
          path: tests

      - name: Check out Open WebUI
        uses: actions/checkout@v5
        with:
          repository: open-webui/open-webui
          ref: ${{ inputs.open-webui-ref }}
          path: open-webui

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            open-webui/backend/requirements.txt
            tests/pyproject.toml

      - name: Install dependencies
        run: |
          uv pip install --system 'torch<=2.9.1' --index-url https://download.pytorch.org/whl/cpu
          uv pip install --system -r open-webui/backend/requirements.txt
          uv pip install --system -e "./tests[postgres]"
          python -m playwright install --with-deps chromium

      - name: Run the integration suite
        working-directory: tests
        env:
          OPEN_WEBUI_SOURCE_DIR: ${{ github.workspace }}/open-webui/backend
          OPEN_WEBUI_LOG_DIR: test-results/server-logs
        run: pytest integration -q --junitxml=test-results/junit.xml --html=test-results/integration-report.html --self-contained-html

      - name: Summarise the results
        if: always()
        working-directory: tests
        run: python scripts/junit_summary.py test-results/junit.xml "Integration suite" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-report-${{ inputs.open-webui-ref }}
          path: tests/test-results
          if-no-files-found: ignore

  # Reports without gating a release until the browser suite has settled.
  e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out the test suite
        uses: actions/checkout@v5
        with:
          repository: open-webui/tests
          ref: ${{ inputs.tests-ref }}
          path: tests

      - name: Check out Open WebUI
        id: open-webui
        uses: actions/checkout@v5
        with:
          repository: open-webui/open-webui
          ref: ${{ inputs.open-webui-ref }}
          path: open-webui

      - name: Restore the frontend build
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: open-webui/build
          key: e2e-frontend-build-${{ steps.open-webui.outputs.commit }}

      - uses: actions/setup-node@v5
        if: steps.build-cache.outputs.cache-hit != 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: open-webui/package-lock.json

      - name: Build the frontend
        if: steps.build-cache.outputs.cache-hit != 'true'
        working-directory: open-webui
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          npm ci --force
          npm run build

      - name: Save the frontend build
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: open-webui/build
          key: e2e-frontend-build-${{ steps.open-webui.outputs.commit }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            open-webui/backend/requirements.txt
            tests/pyproject.toml

      - name: Install dependencies
        run: |
          uv pip install --system 'torch<=2.9.1' --index-url https://download.pytorch.org/whl/cpu
          uv pip install --system -r open-webui/backend/requirements.txt
          uv pip install --system -e ./tests
          python -m playwright install --with-deps chromium

      - name: Run the browser suite
        working-directory: tests
        env:
          OPEN_WEBUI_SOURCE_DIR: ${{ github.workspace }}/open-webui/backend
          OPEN_WEBUI_LOG_DIR: test-results/server-logs
        run: pytest e2e -q --junitxml=test-results/junit.xml --html=test-results/e2e-report.html --self-contained-html

      - name: Summarise the results
        if: always()
        working-directory: tests
        run: python scripts/junit_summary.py test-results/junit.xml "Browser suite" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report, traces and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ inputs.open-webui-ref }}
          path: tests/test-results
          if-no-files-found: ignore

  # The vitest suite drives the frontend source, so it needs the checkout's node_modules.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the test suite
        uses: actions/checkout@v5
        with:
          repository: open-webui/tests
          ref: ${{ inputs.tests-ref }}
          path: tests

      - name: Check out Open WebUI
        uses: actions/checkout@v5
        with:
          repository: open-webui/open-webui
          ref: ${{ inputs.open-webui-ref }}
          path: open-webui

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            open-webui/package-lock.json
            tests/frontend/package-lock.json

      # The checkout's tsconfig extends the one svelte-kit sync generates.
      - name: Install Open WebUI dependencies
        working-directory: open-webui
        run: |
          npm ci --force
          npx svelte-kit sync

      - name: Install the suite
        working-directory: tests/frontend
        run: npm ci

      - name: Run the frontend suite
        working-directory: tests/frontend
        env:
          OPEN_WEBUI_SOURCE_DIR: ${{ github.workspace }}/open-webui/backend
        run: npx vitest run
