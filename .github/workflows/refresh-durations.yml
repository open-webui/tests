# Commits the shard timings a completed regression run of main measured, red runs included (a failed
# test keeps its old entry), so each mode's shards stay balanced as tests are added and the runners
# change. After a regression or terminal run it also records each job's slowest finished time, from
# which those workflows set their timeouts. A run that open-webui/open-webui calls belongs to that
# repository, so it never triggers this.
name: Refresh shard timings

on:
  workflow_run:
    workflows: [Regression suite, Terminal suite]
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: refresh-durations
  cancel-in-progress: false

jobs:
  commit:
    if: >-
      contains(fromJSON('["success", "failure"]'), github.event.workflow_run.conclusion) &&
      github.event.workflow_run.head_branch == 'main' &&
      contains(fromJSON('["workflow_dispatch", "schedule"]'), github.event.workflow_run.event)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Download the refreshed durations
        if: github.event.workflow_run.name == 'Regression suite'
        uses: actions/download-artifact@v4
        with:
          pattern: test-durations-*
          merge-multiple: true
          path: refreshed
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # Timings from a tests ref off main, or from timing files main has changed since, are dropped.
      - name: Refresh the durations
        if: github.event.workflow_run.name == 'Regression suite'
        run: |
          tested=$(cat refreshed/tested-commit)
          if ! git merge-base --is-ancestor "$tested" HEAD || ! git diff --quiet "$tested" HEAD -- durations; then
            echo "The run tested $tested, whose timings no longer match main; nothing to commit."
            exit 0
          fi
          cp refreshed/*.json durations/

      # The workflows take each job's timeout from these.
      - name: Record the job times
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_PATH: ${{ github.event.workflow_run.path }}
        run: python3 scripts/refresh_job_times.py .github/job-times.json "$(basename "$WORKFLOW_PATH" .yml)" ${{ github.event.workflow_run.id }}

      # The push from this token starts no workflow; [skip ci] keeps it that way.
      - name: Commit the timings
        env:
          WORKFLOW_PATH: ${{ github.event.workflow_run.path }}
        run: |
          if git diff --quiet -- durations .github/job-times.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --quiet -m "Timings from $(basename "$WORKFLOW_PATH" .yml) run ${{ github.event.workflow_run.id }} [skip ci]" -- durations .github/job-times.json
          git push origin HEAD:main
